<!DOCTYPE html>
<html lang="ko" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>깜빡 방지! 학사일정 D-Day 카운터</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        .pulse-text {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }
    </style>
</head>
<body class="h-full text-gray-800 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100 flex flex-col">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm z-10 sticky top-0 transition-colors duration-300">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                <i class="fa-solid fa-calendar-check"></i>
                <span>깜빡 방지 D-Day 카운터</span>
            </h1>
            <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-gray-500 dark:text-gray-400" aria-label="다크모드 토글">
                <i class="fa-solid fa-moon text-xl" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-4xl mx-auto px-4 py-6 md:py-8 flex flex-col md:flex-row gap-6">
        
        <!-- Input Section -->
        <section class="w-full md:w-1/3 flex-shrink-0">
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-md p-5 sticky top-24 transition-colors duration-300">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 border-b pb-2 dark:border-gray-700">
                    <i class="fa-solid fa-plus-circle text-primary"></i>
                    새 일정 추가
                </h2>
                <form id="eventForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1 dark:text-gray-300">카테고리</label>
                        <select id="category" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-3 py-2 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors">
                            <option value="수행평가">📝 수행평가</option>
                            <option value="시험">💯 시험 (중간/기말)</option>
                            <option value="과제">📚 과제/숙제</option>
                            <option value="학사일정">🏫 학교 행사/방학</option>
                            <option value="기타">✨ 기타</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-1 dark:text-gray-300">일정 내용 / 과목</label>
                        <input type="text" id="title" required placeholder="예: 국어 독후감 제출, 체육대회" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-3 py-2 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium mb-1 dark:text-gray-300">마감 날짜</label>
                            <input type="date" id="date" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-3 py-2 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 dark:text-gray-300">시간 (선택)</label>
                            <input type="time" id="time" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-3 py-2 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors text-sm">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 mt-2">
                        <i class="fa-solid fa-check"></i> 등록하기
                    </button>
                </form>
            </div>
        </section>

        <!-- List Section -->
        <section class="w-full md:w-2/3">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-xl font-bold">다가오는 일정</h2>
                <div class="text-sm text-gray-500 dark:text-gray-400 font-medium" id="totalCount">총 0개</div>
            </div>
            
            <!-- Filter -->
            <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-hide" id="filterContainer">
                <button class="filter-btn active whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium bg-gray-800 text-white dark:bg-gray-100 dark:text-gray-900 transition-colors" data-filter="all">전체보기</button>
                <button class="filter-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300 hover:bg-gray-300 transition-colors" data-filter="수행평가">📝 수행평가</button>
                <button class="filter-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300 hover:bg-gray-300 transition-colors" data-filter="시험">💯 시험</button>
                <button class="filter-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300 hover:bg-gray-300 transition-colors" data-filter="학사일정">🏫 학교 행사</button>
            </div>

            <!-- List Container -->
            <div id="eventsList" class="space-y-4">
                <!-- Cards will be injected here by JS -->
            </div>
            
            <!-- Empty State (Hidden by default) -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-center text-gray-400">
                <i class="fa-regular fa-calendar-xmark text-6xl mb-4 opacity-50"></i>
                <p class="text-lg">등록된 일정이 없습니다.</p>
                <p class="text-sm mt-1">좌측 폼에서 새로운 일정을 추가해보세요!</p>
            </div>
        </section>
    </main>

    <script>
        // --- State Management ---
        let events = [];
        let currentFilter = 'all';
        let timerInterval = null;

        // DOM Elements
        const eventForm = document.getElementById('eventForm');
        const eventsList = document.getElementById('eventsList');
        const emptyState = document.getElementById('emptyState');
        const totalCount = document.getElementById('totalCount');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        // Date Inputs - Set default to today
        const dateInput = document.getElementById('date');
        const today = new Date();
        // Adjust timezone offset to KST conceptually for input default
        const tzOffset = today.getTimezoneOffset() * 60000;
        const localISOTime = (new Date(Date.now() - tzOffset)).toISOString().split('T')[0];
        dateInput.value = localISOTime;

        // --- Initialization ---
        function init() {
            loadEvents();
            if (events.length === 0) {
                // Add sample data for demonstration (D-1 and D-Day)
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                const tomorrowStr = (new Date(tomorrow - tzOffset)).toISOString().split('T')[0];
                
                events.push({
                    id: Date.now().toString(),
                    category: '수행평가',
                    title: '국어 독후감 제출 (샘플 D-1)',
                    date: tomorrowStr,
                    time: '08:30',
                    createdAt: Date.now()
                });
                
                events.push({
                    id: (Date.now() + 1).toString(),
                    category: '시험',
                    title: '쪽지시험 (샘플 D-DAY)',
                    date: localISOTime,
                    time: '23:59',
                    createdAt: Date.now()
                });
                saveEvents();
            }
            setupEventListeners();
            initTheme();
            render();
            startLiveTimers();
        }

        // --- Event Listeners ---
        function setupEventListeners() {
            eventForm.addEventListener('submit', (e) => {
                e.preventDefault();
                addEvent();
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // UI Update
                    filterBtns.forEach(b => {
                        b.classList.remove('bg-gray-800', 'text-white', 'dark:bg-gray-100', 'dark:text-gray-900', 'active');
                        b.classList.add('bg-gray-200', 'text-gray-700', 'dark:bg-gray-700', 'dark:text-gray-300');
                    });
                    const target = e.target;
                    target.classList.remove('bg-gray-200', 'text-gray-700', 'dark:bg-gray-700', 'dark:text-gray-300');
                    target.classList.add('bg-gray-800', 'text-white', 'dark:bg-gray-100', 'dark:text-gray-900', 'active');
                    
                    currentFilter = target.dataset.filter;
                    render();
                });
            });

            themeToggle.addEventListener('click', toggleTheme);
        }

        // --- Logic ---
        function addEvent() {
            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            if (!title || !date) return;

            const newEvent = {
                id: Date.now().toString(),
                title,
                category,
                date,
                time,
                createdAt: Date.now()
            };

            events.push(newEvent);
            saveEvents();
            
            // Reset form (keep category & date as they might be adding multiples)
            document.getElementById('title').value = '';
            document.getElementById('time').value = '';
            
            render();
            
            // Scroll to the new item (conceptually, but we sort them, so scroll top)
            if(window.innerWidth < 768) {
                window.scrollTo({top: document.getElementById('eventsList').offsetTop - 100, behavior: 'smooth'});
            }
        }

        function deleteEvent(id) {
            events = events.filter(e => e.id !== id);
            saveEvents();
            render();
        }

        function saveEvents() {
            localStorage.setItem('dday_events', JSON.stringify(events));
        }

        function loadEvents() {
            const stored = localStorage.getItem('dday_events');
            if (stored) {
                try { events = JSON.parse(stored); } catch(e) { events = []; }
            }
        }

        // Calculate Days logic
        function calculateDdayInfo(dateStr) {
            // Using standard midnight-to-midnight calculation for D-Day count
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            const target = new Date(dateStr);
            const targetDate = new Date(target.getFullYear(), target.getMonth(), target.getDate());

            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            let ddayText = '';
            let type = ''; // today, tomorrow, future, past

            if (diffDays === 0) {
                ddayText = 'D-DAY';
                type = 'today';
            } else if (diffDays === 1) {
                ddayText = 'D-1';
                type = 'tomorrow';
            } else if (diffDays > 0) {
                ddayText = `D-${diffDays}`;
                type = 'future';
            } else {
                ddayText = `D+${Math.abs(diffDays)}`;
                type = 'past';
            }

            return { diffDays, text: ddayText, type };
        }

        // --- Live Timer Logic ---
        function startLiveTimers() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateAllTimers, 1000);
        }

        function updateAllTimers() {
            const timerElements = document.querySelectorAll('.live-timer');
            const now = new Date();

            timerElements.forEach(el => {
                const targetIso = el.dataset.target; // "YYYY-MM-DDTHH:mm:ss"
                const eventId = el.dataset.id;
                const type = el.dataset.type; // "today" or "tomorrow"
                
                const targetDate = new Date(targetIso);
                const diffMs = targetDate.getTime() - now.getTime();

                if (diffMs <= 0) {
                    el.innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> 마감 시간이 지났습니다.`;
                    el.classList.remove('text-red-600', 'dark:text-red-400');
                    el.classList.add('text-gray-500', 'dark:text-gray-400');
                    // Remove pulse animation
                    const parentAlert = el.closest('.timer-alert-box');
                    if(parentAlert) parentAlert.classList.remove('pulse-text');
                } else {
                    // Calculate H, M, S
                    const hours = Math.floor(diffMs / (1000 * 60 * 60));
                    const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((diffMs % (1000 * 60)) / 1000);
                    
                    const timeString = `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    
                    if (type === 'today') {
                        el.innerHTML = `<i class="fa-solid fa-fire text-orange-500"></i> 오늘 마감! <strong>${timeString}</strong> 남음`;
                    } else {
                        el.innerHTML = `<i class="fa-regular fa-clock"></i> 내일 마감까지 <strong>${timeString}</strong> 남음`;
                    }
                }
            });
        }

        // --- Render UI ---
        function render() {
            eventsList.innerHTML = '';
            
            // Filter
            let filtered = events;
            if (currentFilter !== 'all') {
                filtered = events.filter(e => e.category === currentFilter);
            }

            // Sort (Closest deadline first, past events at the bottom)
            filtered.sort((a, b) => {
                const aTarget = new Date(a.date + 'T' + (a.time || '23:59:59')).getTime();
                const bTarget = new Date(b.date + 'T' + (b.time || '23:59:59')).getTime();
                const now = Date.now();
                
                // If both are past or both are future, sort ascending by date
                if ((aTarget < now && bTarget < now) || (aTarget >= now && bTarget >= now)) {
                     return aTarget - bTarget;
                }
                // If one is past and one is future, future comes first
                return aTarget >= now ? -1 : 1;
            });

            totalCount.textContent = `총 ${filtered.length}개`;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                filtered.forEach(event => {
                    const ddayInfo = calculateDdayInfo(event.date);
                    
                    // Colors based on urgency
                    let badgeBg = 'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200';
                    let ddayColor = 'text-blue-600 dark:text-blue-400';
                    let borderClass = 'border-l-4 border-blue-500';

                    if (ddayInfo.type === 'today') {
                        badgeBg = 'bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-200';
                        ddayColor = 'text-red-600 dark:text-red-400';
                        borderClass = 'border-l-4 border-red-500';
                    } else if (ddayInfo.type === 'tomorrow') {
                        badgeBg = 'bg-orange-100 text-orange-800 dark:bg-orange-900/50 dark:text-orange-200';
                        ddayColor = 'text-orange-600 dark:text-orange-400';
                        borderClass = 'border-l-4 border-orange-500';
                    } else if (ddayInfo.type === 'past') {
                        badgeBg = 'bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300';
                        ddayColor = 'text-gray-400 dark:text-gray-500';
                        borderClass = 'border-l-4 border-gray-300 dark:border-gray-600 opacity-70';
                    }

                    // Format Display Date/Time
                    const eventDateObj = new Date(event.date);
                    const dateDisplay = `${eventDateObj.getFullYear()}년 ${eventDateObj.getMonth()+1}월 ${eventDateObj.getDate()}일`;
                    const timeDisplay = event.time ? event.time : '23:59 (기본)';

                    // HTML structure for card
                    const card = document.createElement('div');
                    card.className = `bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4 md:p-5 flex flex-col md:flex-row justify-between md:items-center gap-4 transition-all hover:shadow-md ${borderClass}`;
                    
                    // Target DateTime string for Timer calculation
                    const targetIsoString = `${event.date}T${event.time ? event.time + ':00' : '23:59:59'}`;

                    // Timer Alert Box (Only for Today and Tomorrow)
                    let timerHtml = '';
                    if (ddayInfo.type === 'today' || ddayInfo.type === 'tomorrow') {
                        const pulseClass = ddayInfo.type === 'today' ? 'pulse-text' : '';
                        timerHtml = `
                            <div class="mt-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg p-2 md:p-3 text-sm flex items-center timer-alert-box ${pulseClass}">
                                <span class="live-timer w-full text-center tracking-wide ${ddayColor} font-bold" 
                                      data-id="${event.id}" 
                                      data-target="${targetIsoString}"
                                      data-type="${ddayInfo.type}">
                                    <!-- Timer will be injected here by JS -->
                                    계산 중...
                                </span>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="flex-grow">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="px-2.5 py-1 text-xs font-bold rounded-md ${badgeBg}">${event.category}</span>
                            </div>
                            <h3 class="text-lg md:text-xl font-bold mb-1 dark:text-white ${ddayInfo.type === 'past' ? 'line-through text-gray-400' : ''}">${event.title}</h3>
                            <div class="text-sm text-gray-500 dark:text-gray-400 flex items-center gap-2">
                                <i class="fa-regular fa-calendar"></i> ${dateDisplay} 
                                <span class="mx-1">|</span> 
                                <i class="fa-regular fa-clock"></i> ${timeDisplay}
                            </div>
                            ${timerHtml}
                        </div>
                        <div class="flex flex-row md:flex-col items-center justify-between md:justify-center gap-4 min-w-[100px] border-t md:border-t-0 md:border-l border-gray-100 dark:border-gray-700 pt-3 md:pt-0 md:pl-5">
                            <div class="text-3xl md:text-4xl font-black ${ddayColor} tracking-tighter">
                                ${ddayInfo.text}
                            </div>
                            <button onclick="deleteEvent('${event.id}')" class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30" aria-label="삭제">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                    
                    eventsList.appendChild(card);
                });
            }
            
            // Force an immediate timer update so users don't see "계산 중..." for 1 second
            updateAllTimers();
        }

        // --- Theme Management ---
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
        }

        // Run
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
